  <circle cx="240" cy="78"  r="20" fill="#534AB7" stroke="#4338ca" stroke-width="1.5"/>
  <text x="240" y="78"  text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" font-family="sans-serif" fill="#fff">A</text>
  <circle cx="240" cy="152" r="20" fill="#534AB7" stroke="#4338ca" stroke-width="1.5"/>
  <text x="240" y="152" text-anchor="middle" dy="0.35em" font-size="13" font-weight="600" font-family="sans-serif" fill="#fff">B</text>
